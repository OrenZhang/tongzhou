name: Build and test
on:
  push:
    branches: [main]
  pull_request:
permissions:
  contents: read
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true
env:
  TONGZHOU_DISABLE_UPDATES: '1'
jobs:
  verify:
    strategy:
      fail-fast: false
      matrix:
        os: [windows-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm test
      - run: npm run build
      - run: npm run test:workspace-layout
      - run: npm run test:desktop
      - run: node scripts/testing/project-deletion-smoke.mjs
      - run: node scripts/testing/updates-smoke.mjs
      - run: node scripts/testing/account-ui-smoke.mjs
      - run: npm run test:account-proxy
      - run: npm run test:managed-network
      - run: npm run test:extensions
      - run: npm run test:dynamic-tools
      - run: npm run test:workflows
      - run: npm run test:turns
      - run: npm run test:ui
      - run: npm run test:session-entry
      - run: npm run test:workbench
      - run: npm run test:capabilities
      - run: npm run test:task-workbench
      - run: npm run test:knowledge
      - run: npm run test:content
      - run: npm run test:personalization
      - run: npm run test:automations
      - run: node scripts/testing/artifacts-smoke.mjs
      - run: node scripts/testing/inline-approval-smoke.mjs
      - run: npm run test:management
      - run: npm run test:markdown
      - run: npm run test:appearance
      - run: npm run test:attachments
      - run: npm run test:project-context
      - run: node scripts/testing/native-smoke.mjs
      - run: npm run dist
        env:
          CSC_IDENTITY_AUTO_DISCOVERY: 'false'
      - run: npm run test:package
        env:
          TONGZHOU_PACKAGE_AUTO: '1'
      - run: npm run test:task-workbench
        env:
          TONGZHOU_PACKAGE_AUTO: '1'
      - uses: actions/upload-artifact@v4
        with:
          name: tongzhou-${{ matrix.os }}
          path: |
            release/*.exe
            release/*.dmg
            release/*.zip
          if-no-files-found: error
      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: diagnostics-${{ matrix.os }}
          path: |
            test-results/*.png
            test-results/*report.json
