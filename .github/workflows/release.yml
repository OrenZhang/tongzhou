name: Publish release
on:
  push:
    branches: [release]
    tags: ['v*']
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: publish-release-${{ github.ref }}
  cancel-in-progress: true
jobs:
  eligibility:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Verify release branch ancestry and version
        run: node scripts/release-version.mjs
  package:
    needs: eligibility
    strategy:
      fail-fast: false
      matrix:
        os: [windows-latest, macos-latest, macos-15-intel, ubuntu-latest]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 40
    env:
      TONGZHOU_DISABLE_UPDATES: '1'
      TONGZHOU_GITHUB_CLIENT_ID: ${{ vars.TONGZHOU_GITHUB_CLIENT_ID }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - name: Install Linux toolchain (X11 headers for the native addon)
        if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install -y libx11-dev libxtst-dev
      - run: npm ci
      - run: npm test
      - run: npm run build
      - name: Route smoke launches through Xvfb on Linux
        if: runner.os == 'Linux'
        shell: bash
        run: echo "SMOKE_PREFIX=xvfb-run -a" >> "$GITHUB_ENV"
      - shell: bash
        run: $SMOKE_PREFIX npm run test:desktop
      - shell: bash
        run: $SMOKE_PREFIX npm run test:workspace-layout
      - shell: bash
        run: $SMOKE_PREFIX npm run test:knowledge
      - shell: bash
        run: $SMOKE_PREFIX node scripts/testing/project-deletion-smoke.mjs
      - shell: bash
        run: $SMOKE_PREFIX node scripts/testing/updates-smoke.mjs
      - name: Package and optionally sign
        run: node scripts/package-release.mjs
        env:
          CSC_IDENTITY_AUTO_DISCOVERY: 'false'
          CSC_LINK: ${{ runner.os == 'Windows' && secrets.WIN_CSC_LINK || secrets.MAC_CSC_LINK }}
          CSC_KEY_PASSWORD: ${{ runner.os == 'Windows' && secrets.WIN_CSC_KEY_PASSWORD || secrets.MAC_CSC_KEY_PASSWORD }}
          APPLE_ID: ${{ secrets.APPLE_ID }}
          APPLE_APP_SPECIFIC_PASSWORD: ${{ secrets.APPLE_APP_SPECIFIC_PASSWORD }}
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
      - shell: bash
        run: $SMOKE_PREFIX npm run test:package
        env:
          TONGZHOU_PACKAGE_AUTO: '1'
      - shell: bash
        run: $SMOKE_PREFIX npm run test:task-workbench
        env:
          TONGZHOU_PACKAGE_AUTO: '1'
      - run: node scripts/release-checksums.mjs
      - uses: actions/upload-artifact@v4
        with:
          name: binaries-${{ matrix.os }}
          if-no-files-found: error
          path: |
            release/*.exe
            release/*.dmg
            release/*.zip
            release/*.AppImage
            release/*.deb
            release/*.blockmap
            release/latest*.yml
            release/SHA256SUMS-*
      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: release-diagnostics-${{ matrix.os }}
          path: |
            test-results/*.png
            test-results/*report.json
          retention-days: 7
  publish:
    needs: package
    runs-on: ubuntu-latest
    concurrency:
      group: publish-release-assets
      cancel-in-progress: false
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npm ci --ignore-scripts
      - uses: actions/download-artifact@v4
        with:
          path: artifacts
          pattern: binaries-*
      - run: node scripts/merge-release-artifacts.mjs
      - name: Publish verified artifacts
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          VERSION=$(node -p "require('./package.json').version")
          if gh release view "v$VERSION" >/dev/null 2>&1; then
            echo "Version already published. Bump package.json; releases are immutable."
            exit 1
          fi
          gh release create "v$VERSION" release-assets/* --target "$GITHUB_SHA" --title "同舟 v$VERSION" --notes-file docs/RELEASE_NOTES.md --draft
          gh release edit "v$VERSION" --draft=false --latest
