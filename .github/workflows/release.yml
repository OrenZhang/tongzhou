name: Publish release
on:
  push:
    branches: [release]
    tags: ['v*']
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: publish-release
  cancel-in-progress: false
jobs:
  package:
    if: github.ref == 'refs/heads/release' || startsWith(github.ref, 'refs/tags/v')
    strategy:
      fail-fast: false
      matrix:
        os: [windows-latest, macos-latest, macos-15-intel]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 40
    env:
      TONGZHOU_DISABLE_UPDATES: '1'
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: node scripts/release-version.mjs
      - run: npm test
      - run: npm run build
      - run: npm run test:desktop
      - run: npm run test:knowledge
      - run: node scripts/project-deletion-smoke.mjs
      - run: node scripts/updates-smoke.mjs
      - name: Package and optionally sign
        run: node scripts/package-release.mjs
        env:
          CSC_IDENTITY_AUTO_DISCOVERY: 'false'
          CSC_LINK: ${{ runner.os == 'Windows' && secrets.WIN_CSC_LINK || secrets.MAC_CSC_LINK }}
          CSC_KEY_PASSWORD: ${{ runner.os == 'Windows' && secrets.WIN_CSC_KEY_PASSWORD || secrets.MAC_CSC_KEY_PASSWORD }}
          APPLE_ID: ${{ secrets.APPLE_ID }}
          APPLE_APP_SPECIFIC_PASSWORD: ${{ secrets.APPLE_APP_SPECIFIC_PASSWORD }}
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
      - run: npm run test:package
        env:
          TONGZHOU_PACKAGE_AUTO: '1'
      - run: npm run test:task-workbench
        env:
          TONGZHOU_PACKAGE_AUTO: '1'
      - run: node scripts/release-checksums.mjs
      - uses: actions/upload-artifact@v4
        with:
          name: binaries-${{ matrix.os }}
          if-no-files-found: error
          path: |
            release/*.exe
            release/*.dmg
            release/*.zip
            release/*.blockmap
            release/latest*.yml
            release/SHA256SUMS-*
      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: release-diagnostics-${{ matrix.os }}
          path: test-results/
          retention-days: 7
  publish:
    needs: package
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npm ci --ignore-scripts
      - uses: actions/download-artifact@v4
        with:
          path: artifacts
          pattern: binaries-*
      - run: node scripts/merge-release-artifacts.mjs
      - name: Publish immutable version with verified artifacts
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          VERSION=$(node -p "require('./package.json').version")
          if gh release view "v$VERSION" >/dev/null 2>&1; then
            echo "Version already published. Bump package.json; releases are immutable."
            exit 1
          fi
          gh release create "v$VERSION" release-assets/* --target "$GITHUB_SHA" --title "同舟 v$VERSION" --notes-file docs/RELEASE_NOTES.md --latest
