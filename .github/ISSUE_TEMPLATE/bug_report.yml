name: Bug report / 缺陷报告
description: Report a reproducible issue without sharing credentials.
body:
  - type: input
    id: version
    attributes:
      label: Version and operating system / 版本与系统
    validations:
      required: true
  - type: textarea
    id: reproduce
    attributes:
      label: Steps and expected behavior / 重现步骤与预期行为
    validations:
      required: true
  - type: textarea
    id: actual
    attributes:
      label: Actual behavior / 实际行为
      description: Remove API keys, account details, project secrets, and private paths.
    validations:
      required: true
